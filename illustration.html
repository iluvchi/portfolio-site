<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>illustration — trinh.info</title>
  <link rel="icon" href="assets/favicon.gif" type="image/gif">
  <link rel="stylesheet" href="assets/nav.css?v=41">
  <link rel="stylesheet" href="assets/site-gate.css?v=18">
  <script src="assets/site-gate.js?v=9"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* photos render smooth; only gifs stay pixelated */
    img:not([src$=".gif"]) {
      image-rendering: auto;
    }

    /* except the three archive scans at the end of the page */
    img[src*="archive-old"] {
      image-rendering: pixelated;
    }

    body {
      margin: 0;
      background-color: #ffffff;
    }

    main {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1.67vw;
      padding: 1.67vw;
      align-items: start;
    }

    .illus-full {
      grid-column: 2 / 12;
      display: block;
      width: 100%;
      height: auto;
    }

    .illus-cherry {
      grid-column: 2 / 12;
      align-self: start;
      background-color: #f4f4f4;
    }

    .illus-cherry img {
      display: block;
      width: 100%;
      height: auto;
    }

    .illus-red {
      border: 1px solid #000;
    }

    /* page header — rotated letters, same treatment as .page-title on the COYSEIO page */
    .page-head {
      grid-column: 2 / 12;
    }

    .page-title {
      font-family: 'ABC Favorit Edu Light', sans-serif;
      font-size: 0.83vw;
      color: #000;
      display: flex;
    }

    .page-title span {
      display: inline-block;
      transform: rotate(15deg);
      letter-spacing: 0.05vw;
      margin-right: 0.02vw;
    }

    .page-desc {
      font-family: 'GT Pressura Mono Light', monospace;
      font-weight: 300;
      font-size: 0.73vw;
      color: #000;
      line-height: 1.25;
      margin-top: 0.83vw;
    }

    @media (max-width: 1919px) {
      .page-title {
        font-size: 1.11vw;
      }

      .page-desc {
        font-size: 0.97vw;
      }
    }

    /* two pieces side by side */
    .illus-hl,
    .illus-hr {
      display: block;
      width: 100%;
      height: auto;
    }

    .illus-hl { grid-column: 2 / 7; }
    .illus-hr { grid-column: 7 / 12; }

    /* sketchbook row — first piece wider */
    .illus-sk-l { grid-column: 2 / 9; }
    .illus-sk-r { grid-column: 9 / 12; }

    .illus-hl img,
    .illus-hr img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 12-column reference grid — toggle with the H key */
    .grid-overlay {
      position: fixed;
      top: 0;
      left: 20vw;
      width: 80vw;
      height: 100vh;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1.67vw;
      padding: 0 1.67vw;
      pointer-events: none;
      z-index: 9998;
    }

    .grid-overlay-col {
      background: rgba(0, 100, 255, 0.07);
    }

    /* --- lightbox --- */
    main img {
      cursor: zoom-in;
    }

    .lightbox {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 20vw;                 /* start after the nav column */
      z-index: 5;                 /* above content, below the fixed nav */
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4vw;
      background: rgba(255, 255, 255, 0.9);
      cursor: zoom-out;
    }

    @media (min-width: 1920px) {
      .lightbox {
        left: 15vw;
      }
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
    }

    @media (min-width: 1920px) {
      .grid-overlay {
        left: 15vw;
        width: 85vw;
      }
    }
  </style>
</head>
<body>
  <nav></nav>
  <div class="grid-overlay" style="display:none;">
    <div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div><div class="grid-overlay-col"></div>
  </div>
  <main>
    <div class="page-head">
      <div class="page-title" id="page-title">Illustration (2020 → Present)</div>
      <p class="page-desc">Artworks span a variety of mediums and techniques, from soft pastel and ink on paper to oil paint and digital pixels.</p>
    </div>
    <div class="illus-cherry">
      <img class="illus-red" src="assets/illustration/cherry-day.png?v=3" alt="">
    </div>
    <img class="illus-hl" src="assets/illustration/quilted-spring-picnic.jpg" alt="">
    <img class="illus-hr" src="assets/illustration/mt-tam-0002.jpg" alt="">
    <img class="illus-hl" src="assets/illustration/clovers-in-september.jpg" alt="">
    <img class="illus-hr" src="assets/illustration/my-tiger.jpg" alt="">
    <img class="illus-hl illus-sk-l" src="assets/illustration/navy-vellum-0001.jpg" alt="">
    <img class="illus-hr illus-sk-r" src="assets/illustration/navy-vellum-0002.jpg" alt="">
    <img class="illus-hl" src="assets/illustration/my-mom-going-to-school.jpg" alt="">
    <img class="illus-hr" src="assets/illustration/archive-old.jpg" alt="">
    <img class="illus-hl" src="assets/illustration/archive-old-2.jpg" alt="">
    <img class="illus-hr" src="assets/illustration/archive-old-3.jpg" alt="">
  </main>
  <div class="lightbox" id="lightbox"><img alt=""></div>
  <script src="assets/nav.js?v=17"></script>
  <script>
    const title = document.getElementById('page-title');
    title.innerHTML = title.textContent.split('').map(l =>
      l === ' ' ? `<span style="display:inline-block;transform:none;width:0.2em;">&nbsp;</span>` : `<span>${l}</span>`
    ).join('');

    // simple lightbox — click an image to enlarge, click anywhere / Esc to close
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');

    document.querySelectorAll('main img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.currentSrc || img.src;
        lightbox.classList.add('open');
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.removeAttribute('src');
    }
    lightbox.addEventListener('click', closeLightbox);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'h' || e.key === 'H') {
        const overlay = document.querySelector('.grid-overlay');
        overlay.style.display = overlay.style.display === 'none' ? 'grid' : 'none';
      }
    });
  </script>
</body>
</html>
