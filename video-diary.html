<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>video diary — trinh.info</title>
  <link rel="icon" href="assets/favicon.gif" type="image/gif">
  <link rel="stylesheet" href="assets/nav.css?v=41">
  <link rel="stylesheet" href="assets/site-gate.css?v=11">
  <script src="assets/site-gate.js?v=7"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #ffffff;
    }

    nav {
      background-color: #ffffff;
    }


    main {
      padding: 4vw 1.67vw;
    }

    .video-item {
      width: 55vw;
      margin-left: auto;
      margin-right: auto;
    }

    .video-item + .video-item {
      margin-top: 4vw;
    }

    .video-embed {
      position: relative;
      width: 100%;
      border: 1px solid #000;
    }

    .video-embed.ratio-16-10 {
      aspect-ratio: 16 / 10;
    }

    .video-embed.ratio-4-3 {
      aspect-ratio: 4 / 3;
    }

    .video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .video-note {
      width: 100%;
      background: rgba(255, 255, 255, 0.01);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid #000;
      border-top: none;
      padding: 1.67vw;
    }

    .video-note-title {
      font-family: 'Source Serif Pro Light Italic', Georgia, 'Times New Roman', serif;
      font-weight: 300;
      font-style: italic;
      font-variation-settings: 'wght' 300;
      font-size: 1.53vw;
      color: #000;
      line-height: 1;
      text-align: center;
    }

    .video-note-body {
      font-family: 'GT Pressura Mono Light', monospace;
      font-weight: 300;
      font-size: 0.73vw;
      color: #000;
      line-height: 1.25;
      margin-top: 1.67vw;
    }

    @media (min-width: 1920px) {
      .video-note-title {
        font-size: 1.15vw;
      }
    }

    @media (max-width: 1919px) {
      .video-note-body {
        font-size: 0.97vw;
      }
    }
  </style>
</head>
<body>
  <nav></nav>
  <main>
    <div class="video-item">
      <div class="video-embed ratio-16-10">
        <iframe
          src="https://www.youtube-nocookie.com/embed/hZ3-J8QepgY?start=1260&cc_load_policy=0&cc_lang_pref=none"
          title="" frameborder="0" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>
      <div class="video-note">
        <h2 class="video-note-title">*˚₊✩*ੈ.・゜゜・Our first time in Seoul・゜゜・．*ੈ✩‧₊˚*</h2>
      </div>
    </div>
    <div class="video-item">
      <div class="video-embed ratio-16-10">
        <iframe
          src="https://www.youtube-nocookie.com/embed/lIuOBKtYwNQ?start=536&cc_load_policy=0&cc_lang_pref=none"
          title="" frameborder="0" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>
      <div class="video-note">
        <h2 class="video-note-title">Hakone &amp; Kyoto, Summer 2025</h2>
      </div>
    </div>
    <div class="video-item">
      <div class="video-embed ratio-4-3">
        <iframe
          src="https://www.youtube-nocookie.com/embed/QshlH82q6i0?cc_load_policy=0&cc_lang_pref=none"
          title="" frameborder="0" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>
      <div class="video-note">
        <h2 class="video-note-title">Tokyo, Summer 2025</h2>
      </div>
    </div>
  </main>
  <script src="assets/nav.js?v=17"></script>
</body>
</html>
