<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="assets/favicon.gif" type="image/gif">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* photos render smooth; only gifs and tiled backgrounds stay pixelated */
    img:not([src$=".gif"]) {
      image-rendering: auto;
    }

    body {
      margin: 0;
      background-color: #E0E0E0;
    }

    main {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      column-gap: 1.67vw;
      row-gap: 6.68vw; /* 4x the column gap */
      /* top padding clears the fixed bar */
      padding: 4.4vw 1.67vw 1.67vw;
      align-items: start;
    }

    .photos-head {
      display: flex;
      align-items: flex-start;
    }

    .photos-head-icon {
      height: 1.6vw;
      width: auto;
      image-rendering: pixelated;
    }

    .photos-head-text {
      height: 2.15vw;
      width: auto;
      image-rendering: pixelated;
      margin-left: -1.2vw;
    }

    main img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* fixed bar across the top of the content area, like a secondary nav —
       gif page-header on the left, "Photo albums [+]" on the right, and the
       album drawer expands downward over the content */
    .albums-footer {
      position: fixed;
      left: 20vw;
      right: 0;
      top: 0;
      z-index: 100;
      padding: 0.83vw 1.67vw; /* matches the subnav's padding */
    }

    @media (min-width: 1920px) {
      .albums-footer {
        left: 15vw;
      }
    }

    .albums-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .albums-toggle {
      font-family: 'ABC Favorit Edu Light', sans-serif;
      font-size: 0.83vw;
      color: #000;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    @media (max-width: 1919px) {
      .albums-toggle {
        font-size: 1.11vw;
      }
    }

    .albums-drawer {
      display: none;
    }

    .albums-footer.open .albums-drawer {
      display: flex;
      gap: 1.67vw;
      overflow-x: auto;
      margin-top: 0.83vw;
    }

    .album {
      flex: none;
      width: 14vw;
      display: block;
      border: 1px solid #000;
      background: #ffffff;
      padding: 0.83vw; /* matches the subnav's padding */
      color: #000;
      text-decoration: none;
    }

    .album img {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .album-title {
      font-family: 'Source Serif Pro Light Italic', Georgia, 'Times New Roman', serif;
      font-weight: 300;
      font-style: italic;
      font-variation-settings: 'wght' 300;
      font-size: 0.83vw;
      color: #000;
      text-align: center;
      line-height: 1.25;
      margin-top: 0.83vw;
    }

    @media (max-width: 1919px) {
      .album-title {
        font-size: 1.11vw;
      }
    }

    /* 12-column reference grid — toggle with the H key */
    .grid-overlay {
      position: fixed;
      top: 0;
      left: 20vw;
      width: 80vw;
      height: 100vh;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1.67vw;
      padding: 0 1.67vw;
      pointer-events: none;
      z-index: 9998;
    }

    .grid-overlay-col {
      background: rgba(0, 100, 255, 0.07);
    }

    @media (min-width: 1920px) {
      .grid-overlay {
        left: 15vw;
        width: 85vw;
      }
    }

    /* ============================================================
       TEMP layout editor — press H to toggle. Drag an image to move
       / reorder it; drag its L/R blue bars to change how many columns
       wide it is; [ ] narrow/widen and , . nudge the hovered item.
       "Save layout" copies the new <main> markup. Delete this comment,
       the .te-* / .dnd-* / .te-item / .te-resize / .te-badge rules,
       and the trailing editor script when done.
       ============================================================ */
    .te-item {
      position: relative;
    }

    body.edit-mode .te-item {
      outline: 1px dashed rgba(0, 0, 255, 0.5);
      cursor: grab;
      touch-action: none;
    }

    body.edit-mode .te-item.dragging {
      cursor: grabbing;
      opacity: 0.85;
    }

    .te-resize {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 14px;
      background: rgba(0, 0, 255, 0.45);
      cursor: ew-resize;
      z-index: 6;
      display: none;
    }

    .te-resize.l { left: -7px; }
    .te-resize.r { right: -7px; }

    body.edit-mode .te-resize {
      display: block;
    }

    .te-badge {
      position: absolute;
      left: 0;
      top: 0;
      background: #0000ff;
      color: #fff;
      font: 11px/1.4 monospace;
      padding: 1px 4px;
      z-index: 6;
      pointer-events: none;
      display: none;
    }

    body.edit-mode .te-badge {
      display: block;
    }

    .dnd-readout {
      position: fixed;
      right: 8px;
      bottom: 44px;
      max-height: 40vh;
      overflow: auto;
      background: #000;
      color: #0f0;
      font: 11px/1.5 monospace;
      padding: 8px;
      z-index: 9999;
      white-space: pre;
      display: none;
    }

    .dnd-save {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 9999;
      background: #0000ff;
      color: #fff;
      border: none;
      font: 12px/1 monospace;
      padding: 8px 10px;
      cursor: pointer;
      display: none;
    }

    .dnd-saveout {
      position: fixed;
      left: 8px;
      bottom: 8px;
      width: 40vw;
      height: 30vh;
      z-index: 9999;
      font: 11px/1.4 monospace;
      display: none;
    }

    body.edit-mode .dnd-readout,
    body.edit-mode .dnd-save {
      display: block;
    }
  </style>

<body>

  <script src="assets/nav.js?v=17"></script>
  <script>
    (function () {
      const footer = document.querySelector('.albums-footer');
      const toggle = footer.querySelector('.albums-toggle');
      const plus = footer.querySelector('.albums-plus');
      toggle.addEventListener('click', function () {
        const open = footer.classList.toggle('open');
        plus.textContent = open ? '[–]' : '[+]';
      });
    })();
  </script>
  <script>
  /* TEMP layout editor — remove along with the matching editor CSS + .grid-overlay div */
  (function () {
    const main = document.querySelector('main');
    const overlay = document.querySelector('.grid-overlay');
    const GAP_VW = 1.67;

    const items = [];
    [...main.querySelectorAll(':scope > img')].forEach(img => {
      const w = document.createElement('div');
      w.className = 'te-item';
      if (img.style.gridColumn) { w.style.gridColumn = img.style.gridColumn; img.style.gridColumn = ''; }
      img.parentNode.insertBefore(w, img);
      w.appendChild(img);
      const badge = document.createElement('div'); badge.className = 'te-badge'; w.appendChild(badge);
      const hL = document.createElement('div'); hL.className = 'te-resize l'; w.appendChild(hL);
      const hR = document.createElement('div'); hR.className = 'te-resize r'; w.appendChild(hR);
      w._img = img; w._badge = badge; w._hL = hL; w._hR = hR;
      items.push(w);
    });

    const readout = document.createElement('div');
    readout.className = 'dnd-readout';
    document.body.appendChild(readout);

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'dnd-save';
    saveBtn.textContent = 'Save layout → copy <main> markup';
    document.body.appendChild(saveBtn);

    const saveOut = document.createElement('textarea');
    saveOut.className = 'dnd-saveout';
    saveOut.readOnly = true;
    document.body.appendChild(saveOut);

    function buildMarkup() {
      let out = '  <main>\n';
      items.forEach(w => {
        const [a, b] = getSpan(w);
        const src = w._img.getAttribute('src');
        out += '    <img src="' + src + '" style="grid-column: ' + a + ' / ' + b + ';" alt="">\n';
      });
      out += '  </main>';
      return out;
    }

    saveBtn.addEventListener('click', () => {
      const markup = buildMarkup();
      saveOut.value = markup;
      saveOut.style.display = 'block';
      saveOut.select();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(markup)
          .then(() => { saveBtn.textContent = 'Copied ✓ — paste over <main>, then delete the editor'; })
          .catch(() => { saveBtn.textContent = 'Select the box below & copy manually'; });
      } else {
        saveBtn.textContent = 'Select the box below & copy manually';
      }
    });

    function metrics() {
      const cs = getComputedStyle(main);
      const r = main.getBoundingClientRect();
      const padL = parseFloat(cs.paddingLeft);
      const padR = parseFloat(cs.paddingRight);
      const contentLeft = r.left + padL;
      const contentW = r.width - padL - padR;
      const gap = window.innerWidth * GAP_VW / 100;
      const colW = (contentW - 11 * gap) / 12;
      return { contentLeft, gap, colW };
    }

    function xToLine(x) {
      const { contentLeft, gap, colW } = metrics();
      let line = Math.round((x - contentLeft) / (colW + gap)) + 1;
      return Math.max(1, Math.min(13, line));
    }

    function getSpan(w) {
      const m = (w.style.gridColumn || '').match(/(\d+)\s*\/\s*(\d+)/);
      if (m) return [+m[1], +m[2]];
      return [1, 13];
    }

    function setSpan(w, a, b) {
      a = Math.max(1, Math.min(12, a));
      b = Math.max(a + 1, Math.min(13, b));
      w.style.gridColumn = a + ' / ' + b;
      refresh();
    }

    function refresh() {
      let text = 'H = toggle  •  drag body = move/reorder  •  drag L/R blue bars = width\n' +
                 '[  ]  narrow / widen hovered item   ,  .  nudge it left / right\n\n';
      items.forEach((w, i) => {
        const [a, b] = getSpan(w);
        w._badge.textContent = a + ' / ' + b;
        const name = w._img.getAttribute('src').split('/').pop();
        text += String(i).padStart(2) + '  ' + (a + ' / ' + b).padEnd(9) + name + '\n';
      });
      readout.textContent = text;
    }

    let edit = false;
    let hovered = null;
    document.addEventListener('keydown', e => {
      if (e.key === 'h' || e.key === 'H') {
        edit = !edit;
        document.body.classList.toggle('edit-mode', edit);
        overlay.style.display = edit ? 'grid' : 'none';
        if (edit) refresh();
        return;
      }
      if (!edit || !hovered) return;
      const [a, b] = getSpan(hovered);
      const wdt = b - a;
      if (e.key === ']') setSpan(hovered, a, b + 1);
      else if (e.key === '[') setSpan(hovered, a, b - 1);
      else if (e.key === '.') { const na = Math.min(13 - wdt, a + 1); setSpan(hovered, na, na + wdt); }
      else if (e.key === ',') { const na = Math.max(1, a - 1); setSpan(hovered, na, na + wdt); }
    });

    let target = null, mode = null, startSpan = null, grabLine = 1;

    items.forEach(w => {
      w.addEventListener('pointerdown', e => {
        if (!edit) return;
        target = w;
        startSpan = getSpan(w);
        grabLine = xToLine(e.clientX);
        if (e.target === w._hL) mode = 'resize-l';
        else if (e.target === w._hR) mode = 'resize-r';
        else { mode = 'move'; w.classList.add('dragging'); }
        w.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

      w.addEventListener('pointermove', e => {
        if (target !== w) return;
        if (mode === 'resize-r') { setSpan(w, startSpan[0], xToLine(e.clientX)); return; }
        if (mode === 'resize-l') { setSpan(w, xToLine(e.clientX), startSpan[1]); return; }

        const width = startSpan[1] - startSpan[0];
        const delta = xToLine(e.clientX) - grabLine;
        const start = Math.max(1, Math.min(13 - width, startSpan[0] + delta));
        setSpan(w, start, start + width);

        const sibs = [...main.children].filter(c => c !== w && c.classList.contains('te-item'));
        const y = e.clientY;
        let before = null;
        for (const s of sibs) {
          const r = s.getBoundingClientRect();
          const band = r.height * 0.35;
          if (y < r.top + r.height / 2 - band) { before = s; break; }
          if (y < r.top + r.height / 2 + band) { before = undefined; break; }
        }
        if (before === undefined) return;
        if (before) {
          if (w.nextElementSibling !== before) main.insertBefore(w, before);
        } else if (main.lastElementChild !== w) {
          main.appendChild(w);
        }
      });

      w.addEventListener('pointerup', () => {
        if (target !== w) return;
        w.classList.remove('dragging');
        target = null; mode = null;
        items.sort((a, b) =>
          (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);
        refresh();
      });

      w.addEventListener('pointerenter', () => { if (edit) hovered = w; });
      w.addEventListener('pointerleave', () => { if (hovered === w) hovered = null; });
    });

    window.addEventListener('resize', () => { if (edit) refresh(); });
  })();
  </script>
</body>
